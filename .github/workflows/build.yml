name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: jcadduono/android_kernel_samsung_msm8974
          ref: cm-14.1
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
      - name: Download GCC 4.9 Toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget https://github.com/jcadduono/android_prebuilts_gcc_linux-x86_arm_arm-eabi-4.9/archive/refs/heads/master.zip
          unzip master.zip
          mv android_prebuilts_gcc_linux-x86_arm_arm-eabi-4.9-master arm-eabi-4.9

      - name: Build Kernel
        run: |
          cd kernel
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=$HOME/toolchains/arm-eabi-4.9/bin/arm-eabi-
          export PATH=$PATH:$HOME/toolchains/arm-eabi-4.9/bin
          make O=out lineage_klteduos_defconfig
          make -j$(nproc) O=out

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zImage
          path: kernel/out/arch/arm/boot/zImage
